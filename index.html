<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gesture Beating</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0e1418;--surface:#151c22;--surface2:#1b242c;--line:rgba(255,255,255,.08);
  --text:#f2f6f7;--muted:#9aa7af;--mint:#5fe0c0;--mint2:#37b89a;--coral:#ff6f61;--amber:#f1c47a;--slate:#7d93c8;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow-x:hidden}
body{background:radial-gradient(130% 90% at 50% -8%,#16212a 0%,var(--bg) 55%);color:var(--text);
  font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;min-height:100%;overflow-x:hidden}
.wrap{max-width:440px;margin:0 auto;padding:20px 16px 40px}
header{text-align:center;margin:6px 0 16px}
.brand{font-family:"Space Grotesk",sans-serif;font-weight:700;font-size:clamp(30px,9vw,42px);letter-spacing:-.01em;margin:0;color:var(--text)}
.brand .dot{color:var(--mint)}
.tag{color:var(--muted);font-size:0.6875rem;letter-spacing:.32em;margin-top:8px;text-transform:uppercase}
.tabs{display:flex;gap:5px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:5px;margin-bottom:14px}
.tab{flex:1;text-align:center;padding:11px 2px;border-radius:10px;color:var(--muted);font-size:0.8125rem;cursor:pointer;font-weight:600;letter-spacing:.02em;transition:.18s;border:1px solid transparent}
.tab.on{color:#08201b;background:var(--mint);border-color:transparent}
.hide{display:none!important}

.panel{border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:12px 14px;margin-top:12px}
.card{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:12px 14px;margin-top:10px}
.card .ct{font-size:0.9375rem;font-weight:700;display:flex;align-items:baseline;gap:8px}
.card .cs{color:var(--muted);font-size:0.75rem;font-weight:500}
.card .cb{margin-top:8px;color:var(--text);font-size:0.8125rem;line-height:1.6}
.card .cb b{color:var(--mint)}
.sect{margin-top:16px;color:var(--muted);font-size:0.6875rem;letter-spacing:.22em;text-transform:uppercase}

.axis{border:1px solid var(--line);border-radius:14px;background:var(--surface);padding:12px 14px;margin-top:10px}
.axis .ah{display:flex;justify-content:space-between;align-items:baseline;font-size:0.8125rem;font-weight:700}
.axis .ah .l{color:var(--coral)}.axis .ah .r{color:var(--mint)}
.axis .an{color:var(--muted);font-size:0.6875rem;letter-spacing:.14em;text-transform:uppercase;text-align:center;margin-bottom:6px}
.grad{height:8px;border-radius:5px;margin:8px 0 6px;background:linear-gradient(90deg,var(--coral),#8a7a70 48%,#6f8f88 56%,var(--mint))}
.grad.g2{background:linear-gradient(90deg,var(--amber),#5d6470)}
.grad.g3{background:linear-gradient(90deg,var(--slate),#5a6f8f)}
.grad.g4{background:linear-gradient(90deg,var(--mint2),#4a5560)}
.grad.g5{background:linear-gradient(90deg,#e08a5f,#6f8f88)}
.arow{display:flex;gap:8px;padding:5px 0;border-top:1px solid var(--line);font-size:0.78125rem}
.arow .ak{color:var(--muted);min-width:66px;flex-shrink:0;font-size:0.75rem}
.arow .av{flex:1}
.arow .av .lv{color:var(--coral)}.arow .av .rv{color:var(--mint)}
.note{color:var(--muted);font-size:0.75rem;line-height:1.6;margin-top:8px}
.note b{color:var(--amber)}

/* 네 조합 매트릭스 */
.mx{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:10px}
.mxc{border:1px solid var(--line);border-radius:12px;background:var(--surface2);padding:8px 7px 9px;text-align:center}
.mxc.act{border-color:rgba(255,111,97,.35)}
.mxc.pas{border-color:rgba(95,224,192,.32)}
.mxc svg{display:block;width:100%;height:auto}
.mxc .t{font-size:0.75rem;font-weight:700;margin-top:4px}
.mxc.act .t{color:var(--coral)}.mxc.pas .t{color:var(--mint)}
.mxc .d{font-size:0.6875rem;color:var(--muted);margin-top:3px;line-height:1.45}
.mxh{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:10px;font-size:0.6875rem;color:var(--muted);letter-spacing:.1em;text-align:center}

.filt{display:flex;gap:5px;flex-wrap:wrap}
.opt{padding:6px 11px;border-radius:18px;border:1px solid var(--line);background:var(--surface2);color:var(--muted);font-size:0.75rem;cursor:pointer;transition:.12s}
.opt.on{color:var(--mint);border-color:var(--mint2);background:rgba(95,224,192,.10)}
.ecard{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:10px 13px;margin-top:8px;border-left:3px solid var(--line);cursor:pointer}
.ecard.gSL{border-left-color:#5c7ba8}.ecard.gHG{border-left-color:#e0a03c}
.ecard.gGY{border-left-color:#6f8f6a}.ecard.gGJ{border-left-color:var(--coral)}
.ecard.gJJ{border-left-color:#8f8778}.ecard.gAT{border-left-color:#c98fa0}
.ecard.gSB{border-left-color:#a98cc4}.ecard.gHH{border-left-color:var(--mint)}

/* 축 저울 */
.axset{margin-bottom:10px}
.axrow{display:grid;grid-template-columns:44px 1fr;align-items:center;gap:9px;margin-bottom:7px}
.axnm{color:var(--muted);font-size:0.75rem;letter-spacing:.04em}
.axtrack{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface2)}
.axst{background:transparent;border:0;border-right:1px solid var(--line);color:var(--muted);font:inherit;font-size:0.75rem;padding:8px 2px;cursor:pointer;transition:.14s}
.axst:last-child{border-right:0}
.axst:hover:not(:disabled){color:var(--text)}
.axst.on{background:var(--mint);color:#08201b;font-weight:700}
.axst:disabled{color:#39424a;cursor:default;background:repeating-linear-gradient(135deg,transparent,transparent 4px,rgba(255,255,255,.02) 4px,rgba(255,255,255,.02) 8px)}
.pill{display:inline-flex;align-items:center;gap:7px}
.pill:disabled{color:#39424a;border-color:rgba(255,255,255,.04);cursor:default;background:transparent}
.axclr{background:none;border:0;color:var(--muted);font:inherit;font-size:0.6875rem;text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:2px 0;margin-top:2px}
.axclr:hover{color:var(--coral)}
.glyph{display:flex;flex-direction:column;gap:2px;width:34px;flex:none}
.grow{display:flex;gap:2px}
.gp{height:3px;flex:1;background:rgba(255,255,255,.09);border-radius:1px}
.gp.lit{background:var(--mint)}
.grow:nth-child(2) .gp.lit{background:var(--amber)}
.grow:nth-child(3) .gp.lit{background:var(--coral)}
.prm{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:9px}
.prmb{background:var(--surface2);border-radius:10px;padding:9px 6px;text-align:center}
.prmk{color:var(--muted);font-size:0.625rem;letter-spacing:.1em;margin-bottom:3px}
.prmv{color:var(--amber);font-size:0.875rem;font-weight:700}
.dirline{border-left:2px solid var(--mint2);padding:2px 0 2px 11px;margin-top:10px;font-size:0.8125rem;line-height:1.65}

/* 참고 탭 도해 */
.fig{width:100%;height:auto;display:block;margin:4px 0 2px}
.txgrid{display:grid;grid-template-columns:52px 1fr 1fr 1fr;gap:4px;font-size:0.6875rem;margin-top:7px;align-items:stretch}
.txk{color:var(--muted);display:flex;align-items:center;letter-spacing:.02em}
.txc{text-align:center;padding:6px 3px;border-radius:9px;background:var(--surface2);line-height:1.35}
.txc.a{color:var(--coral)}.txc.t{color:var(--amber)}.txc.p{color:var(--mint)}
.iax{margin-top:11px}
.iaxh{display:flex;justify-content:space-between;align-items:baseline;font-size:0.75rem;font-weight:700}
.iaxh .nm{color:var(--text)}.iaxh .ed{color:var(--muted);font-weight:500;font-size:0.6875rem}
.iaxl{height:4px;border-radius:2px;margin:6px 0 5px}
.iaxn{color:var(--muted);font-size:0.6875rem;line-height:1.55}
.iaxn b{color:var(--text);font-weight:600}
.p3{display:grid;grid-template-columns:18px 1fr;gap:6px 9px;font-size:0.8125rem;line-height:1.55;margin-top:4px}
.p3 .no{color:var(--mint);font-weight:700}
.form{margin-top:12px;padding:10px 12px;border-radius:11px;background:var(--surface2);font-size:0.8125rem;line-height:1.6}
.form b{color:var(--mint)}
.trow{display:grid;grid-template-columns:74px 1fr;gap:6px 10px;font-size:0.75rem;line-height:1.5;padding:6px 0;border-top:1px solid var(--line)}
.trow:first-of-type{border-top:0}
.trow .tk{color:var(--muted)}
.trow b{color:var(--amber);font-weight:600}
.eh{display:flex;align-items:center;gap:10px}
.eg{width:46px;flex-shrink:0;display:block}
.eg svg{display:block;width:100%;height:auto}
.en{font-size:1rem;font-weight:700;letter-spacing:-.01em}
.edet{display:none}
.ecard.open .edet{display:block}
.etag{font-size:0.625rem;letter-spacing:.06em;padding:2px 7px;border-radius:10px;font-weight:700}
.etag.act{color:#08201b;background:var(--coral)}
.etag.pas{color:#08201b;background:var(--mint)}
.etag.sec{color:var(--amber);border:1px solid rgba(241,196,122,.5);background:rgba(241,196,122,.10)}
.etag.leg{color:var(--slate);border:1px solid rgba(125,147,200,.5);background:rgba(125,147,200,.12)}
.esz{margin-left:auto;color:var(--muted);font-size:0.75rem}
.esc{color:var(--muted);font-size:0.75rem;margin-top:6px;line-height:1.5}
.erow{display:flex;gap:8px;padding:4px 0;border-top:1px solid var(--line);font-size:0.78125rem;margin-top:5px}
.erow .ek{color:var(--muted);min-width:60px;flex-shrink:0;font-size:0.71875rem}
.erow .ev{flex:1}

/* 마디 편집기 */
.frow{display:flex;gap:8px;margin-top:10px}
.field{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.field .flab{color:var(--muted);font-size:0.71875rem}
.sel{appearance:none;-webkit-appearance:none;background:var(--surface2);color:var(--text);border:1px solid var(--line);
  border-radius:10px;padding:9px 26px 9px 11px;font-size:0.8125rem;font-family:inherit;cursor:pointer;width:100%;
  background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
  background-position:calc(100% - 14px) center,calc(100% - 9px) center;background-size:5px 5px,5px 5px;background-repeat:no-repeat}
.sel:focus{outline:none;border-color:var(--mint2)}
.sel option{background:var(--surface2);color:var(--text)}
.inp{background:var(--surface2);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:9px 11px;font-size:0.8125rem;font-family:"IBM Plex Mono",ui-monospace,monospace;width:100%}
.inp:focus{outline:none;border-color:var(--mint2)}
.inp::placeholder{color:#5c676e}
.beat .bs.ch{color:var(--mint);font-family:"IBM Plex Mono",ui-monospace,monospace}
.beat.ov{outline:1px dashed rgba(241,196,122,.55);outline-offset:-3px}
.beats{display:flex;gap:6px;margin-top:12px}
.beat{flex:1;min-width:0;border:1px solid var(--line);border-radius:11px;background:var(--surface2);padding:9px 4px 10px;text-align:center;cursor:pointer;transition:.13s}
.beat:active{transform:scale(.97)}
.beat .bn{font-family:"Space Grotesk",sans-serif;font-size:0.6875rem;color:var(--muted);letter-spacing:.06em}
.beat .bg{margin:5px 0 3px}
.beat .bg svg{display:block;width:100%;height:auto}
.beat .bc{font-size:0.75rem;font-weight:700}
.beat .bl{font-size:0.6875rem;margin-top:1px}
.beat .bs{font-size:0.625rem;color:var(--muted);margin-top:3px}
.beat.act{border-color:rgba(255,111,97,.55)}
.beat.pas{border-color:rgba(95,224,192,.45)}
.beat.act .bc{color:var(--coral)}
.beat.pas .bc{color:var(--mint)}
.beat .bl.sec{color:var(--amber)}
.beat .bl.leg{color:var(--slate)}
.beat.down{box-shadow:inset 0 2px 0 0 rgba(255,255,255,.14)}
.beat.link{background:rgba(241,196,122,.08);border-color:rgba(241,196,122,.5);cursor:default}
.beat.link .bn{color:var(--amber)}
.readout{margin-top:11px;padding:10px 12px;border:1px solid var(--line);border-radius:11px;font-size:0.8125rem;line-height:1.6;color:var(--text)}
.readout b{color:var(--amber)}
.readout .m{color:var(--muted);font-size:0.75rem}

.stage{display:flex;flex-direction:column;align-items:center;margin:10px 0 4px}
.qword{font-size:2rem;font-weight:700;letter-spacing:-.02em;min-height:48px;display:flex;align-items:center;text-align:center}
.prompt{font-size:0.875rem;color:var(--muted);margin-top:2px;min-height:20px;text-align:center}
.choices{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:10px 0 4px}
.choices.c3{grid-template-columns:repeat(3,1fr)}
.choice{padding:14px 8px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--text);font-size:0.875rem;cursor:pointer;transition:.13s;font-weight:600}
.choice:active{transform:scale(.97)}
.choice.correct{background:rgba(95,224,192,.16);border-color:var(--mint);color:#aef0df}
.choice.wrong{background:rgba(255,111,97,.15);border-color:var(--coral);color:#ffc1ba}
.choice.muted{opacity:.4}
.bar{display:flex;gap:9px;margin-top:12px}
.btn{flex:1;padding:13px;border-radius:13px;border:1px solid var(--line);background:var(--surface);color:var(--text);font-size:0.875rem;cursor:pointer;font-weight:600;transition:.15s}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--mint);color:#08201b;border-color:transparent}
.score{display:flex;justify-content:center;gap:22px;margin:14px 0 4px;color:var(--muted);font-size:0.8125rem}
.score b{color:var(--mint);font-variant-numeric:tabular-nums;font-size:1rem;font-family:"Space Grotesk",sans-serif}
.fb{text-align:center;font-size:0.8125rem;color:var(--muted);min-height:38px;margin-top:8px;line-height:1.5}
.fb b{color:var(--amber)}

/* ── 비팅 전용 ── */
.gstage{display:flex;gap:16px;justify-content:center;align-items:stretch;margin-top:6px}
.lhcol{flex:0 0 76px;display:flex;flex-direction:column;align-items:center}
.rhcol{flex:1;max-width:300px;display:flex;flex-direction:column;justify-content:center}
.cap{font-size:.6875rem;color:var(--muted);letter-spacing:.16em;text-transform:uppercase;margin-bottom:6px;text-align:center}
.cap b{color:var(--mint);letter-spacing:0;text-transform:none;margin-left:4px}
.track{position:relative;width:64px;height:238px;background:#0c1216;border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;align-items:flex-end}
.fill{width:100%;align-self:flex-end;z-index:1;background:linear-gradient(180deg,var(--mint),var(--mint2));height:45%;transition:height .07s ease-out}
.fill.hot{background:linear-gradient(180deg,#8fefd6,#39917c)}
.hmark{position:absolute;left:50%;z-index:2;transform:translate(-50%,50%);width:24px;height:24px;border-radius:50%;background:#0c1216;border:3px solid var(--text);bottom:45%;transition:bottom .07s ease-out,transform .08s ease-out}
.hmark.hot{border-color:var(--amber);transform:translate(-50%,50%) scale(1.3);animation:mkbl .3s steps(2,end) infinite}
@keyframes mkbl{50%{opacity:.25}}
.sigbox{position:absolute;top:0;left:0;right:0;height:34%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;border-bottom:1px solid rgba(255,255,255,.14);z-index:5}
.sigdot{width:34px;height:34px;border-radius:50%;border:2px solid rgba(255,255,255,.25);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:var(--muted);transition:transform .08s,background .08s,border-color .08s}
.sigdot.prep{border-color:var(--amber);border-style:dashed;color:var(--amber)}
.sigdot.cue{background:var(--amber);border-color:var(--amber);color:#0b0f12;transform:scale(1.3)}
.planbox{margin-top:11px;border-top:1px solid var(--line);padding-top:10px}
.planrow{margin:0 0 9px}
.planh{font-size:.64rem;font-weight:800;color:var(--muted);letter-spacing:.1em;margin-bottom:5px}
.plangrid{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
.pb{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:44px;text-align:center;background:rgba(255,255,255,.045);border:1px solid var(--line);border-radius:9px;padding:5px 3px}
.pb i{font-style:normal;font-size:.58rem;font-weight:800;color:var(--mint);letter-spacing:.04em}
.pb b{font-size:.62rem;font-weight:700;color:var(--text);line-height:1.28}
.gorow{margin:0 0 10px}
.gorow .gobtn{width:100%}
.emopanel{padding-bottom:0}
.emohead{display:flex;align-items:center;justify-content:space-between;cursor:pointer;padding:2px 0 10px;font-size:.86rem;font-weight:800;color:var(--text)}
.emohead .ch{color:var(--muted);font-size:.8rem}
.emopanel.closed .emobody{display:none}
.emopanel.closed .emohead{padding-bottom:2px}
.emopanel.closed .ch{transform:rotate(-90deg)}
.artlab{display:block;font-size:.6rem;font-weight:700;color:var(--muted);letter-spacing:.04em;margin-top:2px}
.sigcap{font-size:.625rem;font-weight:700;color:var(--muted)}
.gaugebox{position:absolute;bottom:0;left:0;right:0;height:66%;overflow:hidden;display:flex;align-items:flex-end}
.cutdot{position:absolute;left:50%;top:4px;transform:translateX(-50%);width:16px;height:16px;border-radius:50%;background:#ff8f7a;z-index:4;animation:cutbl .28s steps(2,end) infinite}
@keyframes cutbl{50%{opacity:.15}}
.hide{display:none!important}
.zone{position:absolute;left:0;right:0;height:0;border-top:1px dashed rgba(255,255,255,.10);z-index:0}
.zone i{position:absolute;left:5px;top:2px;font-size:.5625rem;font-style:normal;color:rgba(255,255,255,.28);letter-spacing:.08em}
.z1{bottom:78%}.z2{bottom:45%}.z3{bottom:28%}
.tgt{position:absolute;left:2px;right:2px;height:3px;border-radius:2px;background:var(--amber);bottom:0%;transition:bottom .08s linear;z-index:3;box-shadow:0 0 6px rgba(241,196,122,.5)}
.inlab{position:absolute;left:0;right:0;bottom:8px;text-align:center;font-size:.6875rem;font-weight:800;color:#08201b;letter-spacing:.02em;z-index:3;text-shadow:0 1px 0 rgba(255,255,255,.25)}
.cutlab{position:absolute;left:0;right:0;top:8px;text-align:center;font-size:.6875rem;font-weight:800;color:var(--amber);opacity:0;transition:opacity .1s}
.cutlab.on{opacity:1}
#svgWrap{width:100%}
#svgWrap svg{width:100%;height:auto;display:block}
.beatn{text-align:center;font-size:.8125rem;color:var(--muted);margin-top:4px}
.beatn b{color:var(--mint);font-size:1.25rem}
.ctlrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px}
.ctlrow .lb{font-size:.6875rem;color:var(--muted);letter-spacing:.16em;text-transform:uppercase}
select.gsel{background:var(--surface2);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:7px 9px;font-size:.8125rem}
input[type=range]{accent-color:var(--mint);flex:1;min-width:110px}
.gobtn{padding:10px 22px;border:none;border-radius:999px;background:var(--mint);color:#08201b;font-weight:800;font-size:.875rem;cursor:pointer}
.gobtn.on{background:var(--surface2);color:var(--text);border:1px solid var(--line)}
.pill{padding:7px 13px;border:1px solid var(--line);background:var(--surface2);color:var(--muted);border-radius:999px;font-size:.78125rem;font-weight:700;cursor:pointer}
.pill.on{background:var(--mint);color:#08201b;border-color:transparent}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.emorow{display:flex;gap:9px;font-size:.8125rem;line-height:1.6;margin-top:4px}
.emok{flex:0 0 4em;color:var(--muted);font-size:.75rem;font-weight:700}
.live{text-align:center;font-size:.8125rem;color:var(--mint);margin-top:8px;min-height:1.3em}

/* ── 태블릿 (≥700px) ── */
@media (min-width:700px){
  .wrap{max-width:720px;padding:26px 24px 56px}
  body{font-size:17px}
  .brand{font-size:clamp(38px,5vw,50px)}
  .tag{font-size:.8rem}
  .tabs{gap:8px}

function lhPlanAt(bi, n){

    var q = M.P[bi];
    if(q < sQ - 1e-6) return '대기';

function lhTargetManual(bp,n,measIdx,barPos){

  if(LH.mode==='cue'){var tgt=(LH.cue<0?n-1:Math.min(LH.cue,n-1));
    if(bi===tgt&&fr<0.5)return {v:0.95,flash:true,tag:'큐'};
    if(bi===((tgt-1)+n)%n&&fr>0.55)return {v:0.30,tag:'큐 예비'};
    return {v:0.44,tag:'대기'};}
  if(LH.mode==='cresc'||LH.mode==='dim'){
    var rel=measIdx-(LH.cFrom-1);

    var pos=((rel+barPos)%LH.cBars)/LH.cBars;
    if(LH.mode==='cresc')return {v:0.12+pos*0.80,tag:'크레셴도 '+Math.round(pos*100)+'%'};
    return {v:0.92-pos*0.80,tag:'디크레셴도 '+Math.round(pos*100)+'%'};}
  if(LH.mode==='sus'){
    if(barPos<LH.sus)return {v:0.80,flash:(barPos<0.08),tag:'지속'};
    if(LH.cut&&(barPos-LH.sus)<0.18)return {v:0.30,cut:true,tag:'컷'};

function lhTargetEmo(bp,n,measIdx,barPos){

function lhAt(bp,n,measIdx,barPos){

    var sf=Math.min(LH.susFrom||0,n-1),sQ=bq(sf),eQ=Math.min(qTot,sQ+LH.sus*qTot);
    if(nowQ<sQ-1e-6){susProg=0;lvl=0.35;tag='시작 대기';}
    else if(nowQ<eQ){susProg=(nowQ-sQ)/(eQ-sQ);lvl=0.78;tag='지속 중';}

  var goal=lvl;

function click(strong,time){var a=ac(),o=a.createOscillator(),g=a.createGain();

function sched(){var a=ac(),M=meterOf(CUR.sig),spq=60/(+$('bpm').value)/((M.den===8)?1.5:1);
  while(SCH.next<a.currentTime+0.15){click(SCH.bi===0,SCH.next);
    var len=((SCH.bi<M.n-1?M.P[SCH.bi+1]:M.q)-M.P[SCH.bi]);
    SCH.next+=len*spq;SCH.bi=(SCH.bi+1)%M.n;}}
function frame(){
  if(!ST.playing)return;
  var a=ac(),M=meterOf(CUR.sig),spq=60/(+$('bpm').value)/((M.den===8)?1.5:1);
  var pu=(M.q-M.P[M.n-1])*spq||spq;              /* 예비박 한 박 길이 = 마지막 묶음 */
  var PREPN=4;                                    /* 예비박 4개 */
  var barSec=M.q*spq,el=a.currentTime-ST.t0,grow=1;   /* t0 = 본 마디 시작 */
  if(el>=0&&ST.grow){var bars=+ST.grow,mi=Math.floor(el/barSec);grow=0.72+0.5*((mi%bars)+(el%barSec)/barSec)/bars;}
  if(el<0){
    var pk=Math.max(1,Math.min(PREPN,PREPN+Math.floor(el/pu)+1));
    var last=(el>-pu);                            /* 마지막 예비박에서만 움직임 */
    dotAt(last?(M.n-1+Math.max(0,Math.min(0.999,(el+pu)/pu))):(M.n-1),M.n,1,grow,true);
    lhAt(M.n-1,M.n,0,0);
    var _bn=$('beatn');if(_bn)_bn.innerHTML='<b>예비 '+(PREPN-pk+1)+'</b> / '+M.n;
  }else{
    var measIdx=Math.floor(el/barSec),inBar=(el%barSec)/spq,bi=0,i;
    for(i=0;i<M.n;i++)if(inBar>=M.P[i]-1e-6)bi=i;
    var bLen=((bi<M.n-1?M.P[bi+1]:M.q)-M.P[bi])||1;
    var bp=bi+Math.min(0.999,Math.max(0,(inBar-M.P[bi])/bLen));
    dotAt(bp,M.n,bLen/(M.q/M.n),grow);lhAt(bp,M.n,measIdx,inBar/M.q);
  }
  ST.raf=requestAnimationFrame(frame);
}

    +'<br><b>'+e.ar+'</b> — '+(S.sec?'박에 도착하면 잠깐 멈췄다가 출발해요.':'멈추지 않고 이어서 흘러가요.')

function buildEmoSel(){
  var cur=ST.emo.g,o='';
  GROUPS.forEach(function(x){
    o+='<option value="'+x.id+'"'+(cur===x.id?' selected':'')+'>'+x.name+'</option>';});

/* ── 축 좁히기 ── */
var AXS={b:null,t:null,e:null};
function fits(w,s,grp){
  if(s.b!==null&&w.b!==s.b)return false;
  if(s.t!==null&&w.t!==s.t)return false;
  if(s.e!==null&&w.e!==s.e)return false;
  if(grp&&grp!=='ALL'&&w.g!==grp)return false;
  return true;
}
function yieldAx(key,val){
  var s={b:AXS.b,t:AXS.t,e:AXS.e};s[key]=val;
  return EMO.filter(function(w){return fits(w,s,ST.grp);}).length;
}
function yieldGrp(id){
  return EMO.filter(function(w){return fits(w,AXS,id);}).length;
}
function buildAxSet(){
  var box=$('axSet');if(!box)return;
  var o='',ks=['b','t','e'];
  ks.forEach(function(key){
    o+='<div class="axrow"><span class="axnm">'+AXN[key].nm+'</span><span class="axtrack">';
    AXN[key].st.forEach(function(lb,i){
      var on=(AXS[key]===i),live=on?1:yieldAx(key,i);
      o+='<button class="axst'+(on?' on':'')+'" data-k="'+key+'" data-v="'+i+'"'+(live?'':' disabled')+'>'+lb+'</button>';
    });
    o+='</span></div>';
  });
  box.innerHTML=o;
}
function buildChips(){
  var g='<button class="pill'+(ST.grp==='ALL'?' on':'')+'" data-g="ALL">전체</button>';
  GROUPS.forEach(function(x){
    var on=(ST.grp===x.id),live=on?1:yieldGrp(x.id);
    g+='<button class="pill'+(on?' on':'')+'" data-g="'+x.id+'"'+(live?'':' disabled')+'>'+x.name+'</button>';
  });
  $('grpChips').innerHTML=g;
  var e='';EMO.forEach(function(x,i){
    if(fits(x,AXS,ST.grp))e+='<button class="pill'+(x.n===ST.emo.n?' on':'')+'" data-i="'+i+'">'+x.n+glyphHTML(x)+'</button>';
  });
  $('emoChips').innerHTML=e||'<span class="cs">이 조합에는 단어가 없습니다</span>';
  buildAxSet();
}
function buildSel(){
  var s='';SIGS.forEach(function(x){s+='<option value="'+x+'"'+(x===CUR.sig?' selected':'')+'>'+x+'</option>';});
  $('sig').innerHTML=s;
  var opts=GOPT[CUR.sig],g='';
  if(opts&&opts.length>1){opts.forEach(function(x,i){g+='<option value="'+i+'"'+(i===CUR.gi?' selected':'')+'>'+x.join('+')+'</option>';});
    $('grp').style.display='';$('grp').innerHTML=g;}
  else if(opts){$('grp').style.display='';$('grp').innerHTML='<option>'+opts[0].join('+')+'</option>';}
  else $('grp').style.display='none';
}

   +figTexture()
   +'<div class="txgrid">'

   +'<span class="txk">속도</span><span class="txc a">가속 → 급감속</span><span class="txc t">눌러 끌기</span><span class="txc p">등속</span>'

  h+='<div class="ct" style="margin-top:18px">독립 축 3 <span class="cs">예외가 핵심</span></div>'
   +iaxRow('크기','큼','작음','linear-gradient(90deg,#f1c47a,rgba(255,255,255,.10))','큰 음악 = 큰 동작','작은 악티브도, 큰 파시브도 가능')
   +iaxRow('방향','다운 ↓','업 ↑','linear-gradient(90deg,#5fe0c0,#7d93c8)','강박 = 다운','여린내기는 업이 악티브')
   +iaxRow('강세','강박','약박','linear-gradient(90deg,#ff6f61,rgba(255,255,255,.10))','강박을 또렷·크게','4박은 약박이나 반동은 악티브')
   +'<div class="iaxn" style="margin-top:10px"><b>크기의 실체는 관절</b> — 손목은 작게·섬세, 팔뚝은 중간, 어깨·팔 전체는 크게·강함. 무게로 떨어뜨리고 반동을 받되, 필요한 최소 관절만 씁니다.</div>';

   +figRebound();

  h+='<div class="ct" style="margin-top:18px">핵심 원리 3</div><div class="p3">'
   +'<span class="no">1</span><span>익투스는 <b>최저점의 감속·전환점</b>. 최고 속도점이 아니다.</span>'

   +'<div class="trow"><span class="tk">밝기</span><span>비팅으로 번역되지 않습니다. 소리의 색은 손이 아니라 <b>귀로 요구하는 것</b>이라서요.</span></div>';

  h+='<div class="iaxn" style="margin-top:14px"><b>이 앱에서</b> 오른손 도형은 1박이 최저점, 마지막 박이 최고점이에요. 왼손 막대는 높이가 손의 위치고, 금색 선이 지금 가야 할 높이입니다. 시작을 누르면 한 마디를 세는데 마지막 박에서만 손이 움직여요 — 그게 아우프탁트입니다.</div>';
